[package]
name = "turtle-van"
version = "1.0.14"
edition = "2024"
description = "Discord Music Bot"
repository = "https://github.com/kremeshnoi/turtle-van"
authors = ["kremeshnoi"]

[dependencies]
serenity = { version = "0.12.5", default-features = false, features = [
  "client",
  "gateway",
  "rustls_backend",
  "model",
  "voice",
  "cache",
  "standard_framework",
] }
songbird = { version = "0.6.0", features = [
  "builtin-queue",
] }
symphonia = { version = "=0.5.4", features = [
  "all-formats",
  "aac",
  "alac",
  "flac",
  "pcm",
  "adpcm",
  "vorbis",
] }
dotenvy = "0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = "0.7"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "socks",
] }
poise = { version = "0.7.0", features = ["cache"] }
anyhow = "1"
uuid = "1"
thiserror = "2"
async-trait = "0.1.89"

[dev-dependencies]
serde_json = "1"
